#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-ERRORS"
title = "Failure behavior"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = "Authentication or authorization denial MUST use a protocol-level error before tool invocation and MUST NOT parse, include, or diagnose `manifesto_config`. A recognized `deploy_model` domain failure MUST return an MCP tool result with `isError: true` and `structuredContent` matching a closed JSON object with required properties: `schema_version`, the string constant `1`; `code`, one of `INVALID_MANIFESTO_CONFIG`, `INVALID_OPERATOR_CONFIGURATION`, `TARGET_VALIDATION_FAILED`, `APPLY_FAILED`, `READINESS_TIMEOUT`, or `DEPENDENCY_UNAVAILABLE`; `message`, a string from 1 through 1,024 Unicode characters; `retryable`, a boolean; `retry_after_ms`, either null or an integer from 0 through 7,200,000; `field_issues`, an array of at most 32 closed objects; `current_state`, either null or a string from 1 through 253 characters; `suggested_action`, either null or a closed object; and `deployment_id`, either null or a non-empty string no longer than 253 characters. Each field issue object MUST require string properties `field`, `code`, and `message`, each from 1 through 1,024 characters. A suggested action object MUST require `tool_name`, the string constant `deploy_model`, and `arguments`, a closed object matching the `deploy_model` input schema. The service MUST set `field_issues` to an empty array when no caller-correctable field issue is available, `current_state` to null because this synchronous tool exposes no operation-state lifecycle, and `suggested_action` to null when complete safe arguments cannot be returned without disclosing submitted configuration. `INVALID_MANIFESTO_CONFIG`, `INVALID_OPERATOR_CONFIGURATION`, and `TARGET_VALIDATION_FAILED` MUST set `retryable` to false and `deployment_id` to null. `READINESS_TIMEOUT` MUST set `retryable` to true. `DEPENDENCY_UNAVAILABLE` MUST set `retryable` to true and MUST set `deployment_id` to null before target acceptance during the current call or to the derived deployment identifier after target acceptance during the current call. `APPLY_FAILED` MUST set `retryable` according to whether repeating the same rendered deployment can make progress. Every failure after target acceptance during the current call, including `APPLY_FAILED` and `READINESS_TIMEOUT`, MUST include `deployment_id`. Malformed MCP requests and unknown tools MUST use protocol-level errors instead. Error content MUST NOT expose the submitted Manifesto configuration, credentials, internal stack traces, or unbounded dependency output."
