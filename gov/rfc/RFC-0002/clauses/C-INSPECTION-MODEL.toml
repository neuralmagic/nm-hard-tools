#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-INSPECTION-MODEL"
title = "Layered result inspection"
kind = "informative"
status = "active"

[content]
text = "When a service produces complex results or artifacts, agents should normally inspect semantic questions such as outcome, metrics, failure, configuration, or provenance rather than storage filenames and serialization details. A service may provide semantic result views, bounded structured artifact queries, raw resource access, or only a bounded final result according to domain need. The inspection surface should expose the least detail needed first and retain a path to exact evidence when that evidence exists."
