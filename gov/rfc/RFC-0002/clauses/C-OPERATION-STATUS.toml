#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-OPERATION-STATUS"
title = "Self-contained asynchronous status"
kind = "normative"
status = "active"

[content]
text = "When a service returns a handle for asynchronous work, status results MUST include a stable domain identifier, machine-readable state, whether the state is terminal, creation and update times when available, a concise summary, and safe available actions. Nonterminal status MUST provide a polling recommendation or advertised event mechanism. Terminal status MUST identify the availability of its useful result and artifacts. Domain RFCs own the state vocabulary and transitions, but terminal states MUST NOT silently become nonterminal."
