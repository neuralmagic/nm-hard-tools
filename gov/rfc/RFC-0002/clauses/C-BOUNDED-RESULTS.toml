#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-BOUNDED-RESULTS"
title = "Progressive disclosure and result bounds"
kind = "normative"
status = "active"

[content]
text = "Every tool result MUST be bounded by a documented service limit. When a logical result exceeds that limit, the server MUST return a useful summary plus pagination, a narrower follow-up query, or artifact references; it MUST NOT return only an oversize error when a bounded representation is available. List results MUST omit bulky bodies. Reports and semantic inspection views MUST prioritize decision-relevant metrics, provenance, warnings, and links over raw samples, logs, traces, or manifests. Pagination state MUST use `has_more` and `next_cursor` and MUST be independent of evidence fidelity. `completeness: complete` means the full query snapshot contains all matching evidence, even when the current page is not final. `truncated` means matching evidence was permanently omitted from the snapshot, `sampled` means the snapshot contains a disclosed selection of matching evidence, and `approximate` means at least one returned value is an estimate. Any non-complete result MUST include `completeness_reason` and `omitted_scope`; sampled or approximate results MUST also identify their method."
