#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-CAPABILITY-CATALOG"
title = "Discoverable operator capabilities"
kind = "normative"
status = "active"

[content]
text = "When caller-selectable valid input depends on dynamic choices or constraints not represented by the advertised input contract, the service MUST expose a bounded read-only discovery mechanism through an MCP tool or resource. Discovery MUST return stable machine identifiers, caller-facing descriptions, defaults, bounds, mutually dependent constraints, enabled optional features, and a minimal valid example or template. Operator-controlled values that callers cannot select MUST NOT trigger discovery and MUST NOT be enumerated. For a configuration-document field, the metadata required by [[RFC-0002:C-CONFIGURATION-DOCUMENTS]], an advertised schema authority or pinned consumer version, and a bounded valid example MAY satisfy discovery without adding another tool. Large discovery results MUST support filtering or cursor pagination and MUST report omitted content."
