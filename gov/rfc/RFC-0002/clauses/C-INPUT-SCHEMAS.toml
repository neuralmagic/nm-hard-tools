#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-INPUT-SCHEMAS"
title = "Agent-constructible inputs"
kind = "normative"
status = "active"

[content]
text = "Every tool input MUST be a closed JSON object that rejects unknown top-level properties. Fixed semantic values SHOULD use typed structured fields with explicit formats, enums for closed choices, unit-bearing names, documented defaults, and descriptions where meaning is not evident. A tool MAY use a bounded configuration document string as its primary domain payload when an extensible external or operator-pinned schema is the authoritative representation; such inputs MUST satisfy [[RFC-0002:C-CONFIGURATION-DOCUMENTS]]. Tool inputs MUST NOT accept shell fragments, arbitrary command-line arguments, credentials, or an encoded private request representation."
