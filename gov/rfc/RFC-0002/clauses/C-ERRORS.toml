#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-ERRORS"
title = "Actionable stable errors"
kind = "normative"
status = "active"

[content]
text = "Invalid MCP envelopes, authentication failures, unknown tools, unsupported methods, and protocol negotiation failures MUST use protocol-level errors. A recognized tool that cannot complete its domain action MUST return `isError: true` and `structuredContent` matching the tool output schema's common error branch. That branch MUST be a closed object with required string `code`, required string `message`, required boolean `retryable`, nullable integer `retry_after_ms`, required array `field_issues`, nullable string `current_state`, and nullable object `suggested_action`. Each field issue MUST be a closed object containing string `field`, string `code`, and string `message`. A suggested action MUST be a closed object containing `tool_name` and complete safe `arguments`, or be null. RFC-owned codes MUST include `INVALID_ARGUMENT`, `PLAN_EXPIRED`, `PLAN_STALE`, `PLAN_NOT_FEASIBLE`, `INVALID_CURSOR`, `NOT_FOUND`, `REFERENCE_EXPIRED`, `STATE_CONFLICT`, `RESULT_NOT_READY`, `INCOMPATIBLE_RESULTS`, `QUERY_DEADLINE_EXCEEDED`, `RATE_LIMITED`, `DEPENDENCY_UNAVAILABLE`, and `INTERNAL_ERROR`. Domain-specific codes MUST be prefixed `EVALUATION_` or `BENCHMARK_`. Multi-operation errors MUST place readiness and incompatibility diagnostics in `field_issues` using stable paths such as `operation_ids[2]`; `current_state` MUST be null for multi-operation errors. `PLAN_EXPIRED`, `PLAN_STALE`, and `PLAN_NOT_FEASIBLE` MUST suggest the applicable plan tool; `INVALID_CURSOR` MUST suggest restarting the applicable listing, inspection, artifact-query, or comparison tool. `retry_after_ms` MUST be non-null for a retryable rate limit and SHOULD be non-null for a transient dependency failure. Error content MUST NOT expose credentials, stack traces, internal network locations, or unbounded upstream bodies."
