#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-TOOL-METADATA"
title = "Tool selection metadata"
kind = "normative"
status = "active"

[content]
text = "Every tool MUST provide a stable name, a title, a description, an input schema, an output schema, and MCP tool annotations. Each output schema MUST use JSON Schema composition to accept exactly one of the tool's successful `structuredContent` shape or the common tool-error shape defined by [[RFC-0002:C-ERRORS]]. A description MUST say when to use the tool, its material side effect or lack thereof, its principal prerequisite, and what the successful result enables. `readOnlyHint`, `destructiveHint`, `idempotentHint`, and `openWorldHint` MUST accurately describe observable behavior. Tools MUST be returned in deterministic name order."
