#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-ARTIFACT-QUERY"
title = "Bounded structured artifact queries"
kind = "normative"
status = "active"

[content]
text = "`query_evaluation_artifact` and `query_benchmark_artifact` MUST accept either a first-call object containing `artifact_ref`, exactly one advertised query variant, and optional `page_size`, or a continuation object containing only `cursor`. `page_size` MUST default to the query-mode descriptor's default and MUST be between one and its advertised maximum. `json_pointer` MUST use RFC 6901 syntax and select one bounded subtree. Text lines MUST be decoded as UTF-8 with replacement, numbered from one, and ordered by increasing line number. `text_search` MUST use a non-empty literal, default `case_sensitive` to false, and bound preceding and following context lines. `line_range` MUST use inclusive `start_line` and positive `line_count`. `table` MUST use advertised columns and typed `eq`, `ne`, `lt`, `lte`, `gt`, and `gte` filters combined by logical AND. `time_range` MUST use RFC 3339 `start_inclusive` and `end_exclusive` values and order equal timestamps by stable source position. Query inputs MUST NOT accept executable code, regular expressions, SQL, jq, JSONPath, shell syntax, or implementation-specific expressions. Before expensive work, the service MUST reject a query that exceeds a statically checkable advertised scan, time-span, column, context, or page-size bound with `INVALID_ARGUMENT`; its field issue MUST identify the bound and its suggested action MUST contain a safe narrower query. The service MUST enforce the advertised execution deadline at runtime. Reaching that deadline before producing a valid page MUST return non-retryable `QUERY_DEADLINE_EXCEEDED` with a safe narrower suggested query and MUST NOT return an unmarked partial page. Results MUST contain artifact identity and digest, normalized query, result schema identifier and version, ordering, `data`, `completeness`, `completeness_reason`, `omitted_scope`, `has_more`, and `next_cursor`; `data` MUST conform to the advertised query result schema. A query MUST NOT mutate an artifact or silently scan a different artifact version."
