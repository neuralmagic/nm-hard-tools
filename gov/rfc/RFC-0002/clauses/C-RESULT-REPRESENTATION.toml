#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-RESULT-REPRESENTATION"
title = "Token-efficient structured results"
kind = "normative"
status = "active"

[content]
text = "Every tool call that includes `structuredContent` MUST conform to the tool's advertised output schema. A successful result MUST match the schema's success branch, and a result with `isError: true` MUST match only the common tool-error branch in [[RFC-0002:C-ERRORS]]. Text content MUST be a concise caller-facing summary and MUST NOT duplicate a serialization of the complete structured result for protocol version `2026-07-28`. Text content SHOULD be no more than 1,024 Unicode characters. Every versioned domain success result MUST include `schema_version`. Timestamps MUST use RFC 3339 with an explicit offset, byte counts MUST be integers, and durations and rates MUST identify their units in field names."
