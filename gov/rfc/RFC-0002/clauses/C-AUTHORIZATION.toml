#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-AUTHORIZATION"
title = "Authorization and open-world safety"
kind = "normative"
status = "active"

[content]
text = "Servers MUST authenticate requests before parsing or executing tool arguments when authentication is configured. Tool results and catalogs MUST reveal only choices and artifacts authorized for the caller. The server MUST select credentials, endpoints, datasets, queues, images, and cluster policy from operator-controlled configuration or catalog identifiers rather than caller-provided secrets or arbitrary locations. A tool MUST set `openWorldHint` to false unless it can contact destinations outside the operator-defined environment as a direct consequence of caller input."
