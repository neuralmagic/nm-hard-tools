#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-PLAN"
title = "Exact preview before mutation"
kind = "normative"
status = "active"

[content]
text = "A service SHOULD expose a read-only planning operation when a mutation is expensive, asynchronous, difficult to reverse, or materially affected by resolved defaults that are not visible in the submitted input. Satisfying all of the following conditions is an accepted reason not to expose a separate planning operation: the complete caller-controlled intent is visible before invocation; execution has a domain-governed finite bound; repeated calls converge idempotently; and failure before target acceptance leaves external state unchanged. When planning is exposed, its result MUST show the resolved intent, material resources and placement, warnings, stable digest, and expiration when applicable without performing the mutation."
