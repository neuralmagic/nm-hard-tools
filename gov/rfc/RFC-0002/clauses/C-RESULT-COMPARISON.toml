#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-RESULT-COMPARISON"
title = "Cross-operation comparison"
kind = "normative"
status = "active"

[content]
text = "`compare_evaluations` and `compare_benchmarks` MUST accept either a first-call object containing between two and eight domain operation identifiers, a required `baseline_operation_id` drawn from those identifiers, a discovered comparison-enabled view, view parameters, and optional `page_size`, or a continuation object containing only `cursor`. The server MUST validate view parameters against the advertised `parameters_schema` and MUST return `INVALID_ARGUMENT` field issues for violations. An operation that may still reach a comparison-applicable state MUST produce `RESULT_NOT_READY` with a field issue for its indexed identifier; a terminal operation that cannot support the view MUST produce `STATE_CONFLICT`. Comparison MUST align values by the descriptor's stable alignment keys. Duplicate alignment keys without the descriptor-defined aggregation MUST return `INCOMPATIBLE_RESULTS` with indexed field issues. Every required-equal compatibility field MUST match or the service MUST return `INCOMPATIBLE_RESULTS` with field issues for each mismatch. Differences in report-only context fields MAY be compared but MUST be returned structurally. For each finite numeric candidate and baseline with the same unit, `absolute_delta` MUST equal candidate minus baseline. `relative_delta` MUST equal `absolute_delta / abs(baseline)` when the baseline is nonzero and the measure declares `ratio_comparable: true`; otherwise it MUST be null with `relative_delta_reason`. Improvement or regression MUST be derived from the measure's advertised improvement direction and MUST be `neutral` when that direction is neutral. Missing, nonnumeric, nonfinite, sampled, and approximate values MUST remain explicit and MUST NOT be silently coerced. The bounded paginated result MUST identify the operations, baseline, view schema, ordering, units, aligned values, missing values, context differences, deltas, `completeness`, `completeness_reason`, `omitted_scope`, `has_more`, and `next_cursor`; sampled or approximate values MUST identify their method."
