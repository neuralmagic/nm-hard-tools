#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-CANCELLATION"
title = "Safe cancellation semantics"
kind = "normative"
status = "active"

[content]
text = "`cancel_<domain>` MUST be idempotent and MUST preserve the operation record and completed artifacts. Cancelling a terminal operation MUST return its current status without changing it. Cancelling an active operation MUST return the resulting or transitional status and MUST NOT claim completion before cancellation is durable. The tool MUST be annotated as destructive because it stops intended work, even though the operation record is retained."
