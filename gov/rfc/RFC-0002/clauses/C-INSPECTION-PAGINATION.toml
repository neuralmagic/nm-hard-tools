#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-INSPECTION-PAGINATION"
title = "Stable inspection pagination"
kind = "normative"
status = "active"

[content]
text = "A semantic inspection, artifact query, or comparison that returns ordered items MUST use opaque cursor pagination. The first call MUST establish a fixed query snapshot, resolved schemas, ordering, and page size. Derived cursors MUST preserve those choices and MUST traverse each matching item exactly once. The service MUST apply a deterministic default order and MUST report that order in the result. A continuation call MUST accept the cursor as its only required argument and MUST NOT require the caller to repeat the original query. Supplying query arguments with a continuation cursor MUST return `INVALID_CURSOR`. An expired cursor MUST return `INVALID_CURSOR` with a suggested action containing the original safe first-call arguments without the cursor."
