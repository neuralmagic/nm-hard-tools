#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-INSPECTION-PROVENANCE"
title = "Inspection evidence and explainability"
kind = "normative"
status = "active"

[content]
text = "Every derived inspection or comparison result MUST identify its subject identities, source artifact or result versions when available, schema or interpretation version, effective query parameters, and snapshot time. Derived, sampled, approximate, or incomplete values MUST identify the method and source fields or evidence needed to interpret them. Service-generated summaries MUST distinguish observed facts from derived values and MUST NOT present unsupported causal explanations as evidence."
