#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-COMPATIBILITY"
title = "Compatibility and evolution"
kind = "normative"
status = "active"

[content]
text = "Published tool names, required input fields, field meanings, state meanings, error codes, and structured output fields MUST remain backward compatible within a service major version. Additive optional object fields MAY be introduced within a major version. Adding, removing, or changing an output enum value is a breaking change unless the field was specified as an open string vocabulary with mandatory unknown-value handling. A breaking change MUST use a new service major version or a new tool name and MUST leave the prior surface discoverable for a documented migration window. `schema_version` MUST change when a persisted report or artifact schema changes, and readers MUST be able to distinguish supported from unsupported versions."
