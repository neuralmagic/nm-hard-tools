[project]
name = "nm-hard-tools"
version = "0.1.0"
description = "MCP services for rigorous inference evaluation and benchmarking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "kubernetes>=33,<35",
  "pyyaml>=6,<7",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
lm-eval-service = [
  "lm_eval[api] @ git+https://github.com/EleutherAI/lm-evaluation-harness.git@8a07e1110d060de48cfc7a9a7987b7659060b60b",
]
test = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]
model-deployment = [
  "llm-manifesto @ git+https://github.com/neuralmagic/llm-manifesto.git@1ba2eb87fe9bb2920d375522f424f758d949ee55",
]

[project.scripts]
inference-hard-forward-benchmark-mcp = "nm_hard_tools.main:forward_benchmark_mcp"
inference-hard-lm-eval-service = "nm_hard_tools.evaluation_service.api:main"
nm-hard-model-deployment = "nm_hard_tools.model_deployment.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nm_hard_tools"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
ignore = ["B008"]
