name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: azure/setup-helm@v5.0.1
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check tag and chart versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          for chart in charts/*; do
            test "$(helm show chart "$chart" | awk '/^version:/ {print $2}')" = "$version"
          done
      - name: Build forward-pass adapter
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile.forward-benchmark-mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/neuralmagic/inference-hard-forward-mcp:${{ github.ref_name }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
      - name: Build lm-eval service
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile.lm-eval-service
          platforms: linux/amd64
          push: true
          tags: ghcr.io/neuralmagic/inference-hard-lm-eval:${{ github.ref_name }}
          build-args: |
            BASE_IMAGE=python:3.12.11-slim@sha256:47ae396f09c1303b8653019811a8498470603d7ffefc29cb07c88f1f8cb3d19f
            LM_EVAL_COMMIT=8a07e1110d060de48cfc7a9a7987b7659060b60b
            SOURCE_REVISION=${{ github.sha }}
      - name: Package charts
        run: |
          mkdir -p dist
          for chart in charts/*; do helm package "$chart" --destination dist; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
