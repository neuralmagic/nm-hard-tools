image:
  # Required. The chart never assumes a personal or environment-specific registry.
  repository: ""
  # Required: sha256:<64 hex characters>. Tags are intentionally unsupported.
  digest: ""
  pullPolicy: IfNotPresent

# Registry credentials already present in the release namespace, for example
# [{name: registry-pull}].
imagePullSecrets: []

replicaCount: 1
nodeSelector:
  kubernetes.io/arch: amd64
rbac:
  # Set false when an operator provisions equivalent grants separately.
  create: true
service:
  port: 8080

auth:
  # Required Secret containing the bearer token accepted by mutation endpoints.
  existingSecret: ""
  secretKey: token
  mutationRateLimitPerMinute: 20
  allowedOrigins: []

controller:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

worker:
  cacheSizeLimit: 1Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

persistence:
  existingClaim: ""
  accessModes: [ReadWriteMany]
  size: 20Gi
  storageClassName: ""

requestSetStorage:
  # Required: the PVC holding the frozen request-set JSONL files the catalog
  # below names. Workers mount it read-only; each entry is pinned by sha256 and
  # a moved file is refused, so this volume is content, not configuration.
  existingClaim: ""
  mountPath: /var/lib/diff-probe-request-sets

# Requests select only operator-defined logical names; callers cannot supply URLs.
targets: {}

# The frozen request-set catalog. `file` is relative to
# requestSetStorage.mountPath and `sha256` pins its exact content.
requestSets: {}

networkPolicy:
  # Controller ingress is limited to this release's namespace. Replace the
  # illustrative egress rules with cluster-specific API server, DNS, storage,
  # and target rules before deployment. NetworkPolicy cannot select arbitrary
  # Service DNS names; the logical allowlist remains the authoritative
  # application-layer control.
  enabled: true
  controllerEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
  workerEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Add cluster-specific, narrowly scoped inference egress: allow only the
    # configured target Services and ports.
