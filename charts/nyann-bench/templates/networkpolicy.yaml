{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: nyann-bench-api}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: nyann-bench-api}
  policyTypes: [Ingress, Egress]
  ingress: {{- toYaml .Values.networkPolicy.controllerIngress | nindent 4 }}
  egress: {{- toYaml .Values.networkPolicy.controllerEgress | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: nyann-bench-workers}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: nyann-bench}
  policyTypes: [Ingress, Egress]
  ingress: {{- toYaml .Values.networkPolicy.workerIngress | nindent 4 }}
  egress: {{- toYaml .Values.networkPolicy.workerEgress | nindent 4 }}
{{- end }}
