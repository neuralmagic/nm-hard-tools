{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: nyann-bench-api}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: nyann-bench-api}
subjects:
  - {kind: ServiceAccount, name: nyann-bench-api}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nyann-bench-api
{{- end }}
