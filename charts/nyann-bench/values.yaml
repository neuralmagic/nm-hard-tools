image: ""
runnerImage: ""
imagePullSecrets: []
nodeSelector: {}

networkPolicy:
  enabled: false
  controllerIngress: []
  controllerEgress: []
  workerIngress: []
  workerEgress: []

auth:
  existingSecret: ""
  secretKey: token

targets: {}
storage:
  resultsClaim: ""
  datasetClaim: ""
  resultsRoot: /var/lib/nyann-bench/results
  datasetRoot: /var/lib/nyann-bench/datasets

policy:
  allowedTargetHosts: []
  allowedTargetSuffixes: []
  allowedPlatforms: [kubernetes, openshift]
  maxWorkers: 4
  maxCPU: "8"
  maxMemory: 16Gi
  defaultActiveDeadline: 1h
  maxActiveDeadline: 2h
  defaultRetentionTTL: 24h
  maxRetentionTTL: 168h
  maxArtifactFiles: 512
  maxArtifactBytes: 4294967296
  maxReportRecords: 5000000
  maxLatencySamples: 50000
  maxIndexedRuns: 1000
  artifactProcessingTimeout: 2m

rbac:
  create: true

service:
  port: 8080

resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "1", memory: 256Mi}
